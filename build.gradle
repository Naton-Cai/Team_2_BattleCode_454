def resolveMaps = {
  def mapsProperty = project.findProperty('maps')
  if (mapsProperty != null && !mapsProperty.toString().trim().isEmpty()) {
    return mapsProperty.toString().trim()
  }
  def unique = new ArrayList(compareMapPool.unique(false))
  Collections.shuffle(unique)
  int n = Math.min(3, unique.size())
  return unique.subList(0, n).join(',')
}

task setSnapshotAggression {
  description 'If -Paggression is set, writes it into src/<teamB>/Aggression.java. Otherwise leaves that file unchanged.'
  group 'battlecode'
  onlyIf {
    def value = project.findProperty('aggression')
    value != null && !value.toString().trim().isEmpty()
  }
  def destFile = { file("src/${project.property('teamB')}/Aggression.java") }
  doLast {
    File dest = destFile()
    if (!dest.isFile()) {
      throw new GradleException(
          "Missing ${dest}. Run ./gradlew copyPlayer first, then retry with -Paggression.")
    }
    String raw = project.property('aggression').toString().trim()
    if (!(raw ==~ /-?\d+(\.\d+)?[fF]?/)) {
      throw new GradleException("aggression must be a float, got '${raw}'")
    }
    String literal = raw.endsWith('f') || raw.endsWith('F') ? raw : raw + 'f'
    String text = dest.getText('UTF-8')
    String assignment = "static final float AGGRESSION = ${literal};"
    if (!(text =~ /static final float AGGRESSION = [^;]+;/)) {
      throw new GradleException("Could not find AGGRESSION assignment in ${dest}")
    }
    String updated = text.replaceFirst(/static final float AGGRESSION = [^;]+;/, assignment)
    dest.write(updated, 'UTF-8')
    logger.quiet("Set ${dest} AGGRESSION = ${literal}")
  }
}
compileJava.mustRunAfter setSnapshotAggression

task runJavaLocal(type: JavaExec) {
  mainClass = 'battlecode.server.Main'
  classpath = sourceSets.main.runtimeClasspath
  args = ['-c=-']
  jvmArgs = [
    '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED',
    '--add-opens=java.base/jdk.internal.math=ALL-UNNAMED',
    '--add-opens=java.base/jdk.internal.util=ALL-UNNAMED',
    '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED',
    '--add-opens=java.base/sun.security.action=ALL-UNNAMED',
    '-Dbc.server.wait-for-client=' + (project.findProperty('waitForClient') ?: 'false'),
    '-Dbc.server.mode=headless',
    '-Dbc.server.map-path=maps',
    '-Dbc.server.robot-player-to-system-out=' + (project.findProperty('outputVerbose') ?: 'true'),
    '-Dbc.server.debug=false',
    '-Dbc.engine.debug-methods=' + (project.findProperty('debug') ?: 'false'),
    '-Dbc.engine.enable-profiler=' + (project.findProperty('enableProfiler') ?: 'false'),
    '-Dbc.engine.show-indicators=' + (project.findProperty('showIndicators') ?: 'true'),
    '-Dbc.game.team-a=' + project.property('teamA'),
    '-Dbc.game.team-b=' + project.property('teamB'),
    '-Dbc.game.team-a.language=' + (project.findProperty('languageA') ?: 'java'),
    '-Dbc.game.team-b.language=' + (project.findProperty('languageB') ?: 'java'),
    '-Dbc.game.team-a.url=' + (project.findProperty('classLocationA') ?: defaultClassLocation),
    '-Dbc.game.team-b.url=' + (project.findProperty('classLocationB') ?: defaultClassLocation),
    '-Dbc.game.team-a.package=' + (project.findProperty('packageNameA') ?: project.property('teamA')),
    '-Dbc.game.team-b.package=' + (project.findProperty('packageNameB') ?: project.property('teamB')),
    '-Dbc.server.validate-maps=' + project.property('validateMaps'),
    '-Dbc.server.alternate-order=' + project.property('alternateOrder'),
  ]
  doFirst {
    def maps = resolveMaps()
    logger.quiet("Maps: ${maps}")
    jvmArgs '-Dbc.game.maps=' + maps
    def replay = project.findProperty('replay')
    if (replay == null) {
      replay = 'matches/' + matchStamp + '-' + matchGit + '-' +
          truncateString(project.property('teamA') + '-vs-' + project.property('teamB') + '-on-' + maps, 80) +
          '.bc26'
    }
    jvmArgs '-Dbc.server.save-file=' + replay
  }
}
runJavaLocal.dependsOn setSnapshotAggression

task runJava(dependsOn: runJavaLocal) {}

task runPyLocal(type: Exec, dependsOn: installPyLocal) {
  commandLine python, '-m', 'battlecode26',
    '--teamA', project.findProperty('languageA') == 'python' ? project.property('teamA') : '/',
    '--teamB', project.findProperty('languageB') == 'python' ? project.property('teamB') : '/',
    '--dirA', botDirectory.absolutePath,
    '--dirB', botDirectory.absolutePath,
    '--new-process'
}

task runPy(type: Exec) {
  mustRunAfter downloadPyPackage
  commandLine python, '-m', 'battlecode26',
    '--teamA', project.findProperty('languageA') == 'python' ? project.property('teamA') : '/',
    '--teamB', project.findProperty('languageB') == 'python' ? project.property('teamB') : '/',
    '--dirA', botDirectory.absolutePath,
    '--dirB', botDirectory.absolutePath,
    '--new-process'
}

task runLocal {
  description 'Runs a match locally (no updates) without starting the client.'
  group 'battlecode'
  dependsOn runJavaLocal
}

task run {
  description 'Runs a match without starting the client.'
  group 'battlecode'
  dependsOn runJava
}

if (project.findProperty("languageA") == "python" || project.findProperty("languageB") == "python") {
  run.dependsOn downloadPyPackage
  run.dependsOn runPy
  runJava.mustRunAfter runPy
  runLocal.dependsOn installPyLocal
  runLocal.dependsOn runPyLocal
  runJavaLocal.mustRunAfter runPyLocal
}


//////// Informational ////////

task listPlayers {
  description 'Lists all available players.'
  group 'battlecode'

  doLast {
    sourceSets.main.allSource.each {
      logger.debug(it.name)
      if (it.getName().equals('RobotPlayer.java') || it.getName().equals('RobotPlayer.scala')) {
        URI base = new File(project.projectDir, 'src').toURI()
        URI full = it.toURI()
        String path = base.relativize(full).toString()
        logger.quiet(path.substring(0, path.lastIndexOf('/')).replaceAll('/', '.'))
      }
    }
  }
}

task listMaps {
  description 'Lists all available maps.'
  group 'battlecode'

  doLast {
    sourceSets.main.compileClasspath.each {
      logger.debug(it.name)
      if (it.toString().contains('battlecode26-')) {
        FileCollection fc = zipTree(it)
        fc += fileTree(new File(project.projectDir, 'maps'))
        fc.each {
          String fn = it.getName()
          if (fn.endsWith('.map26')) {
            logger.quiet(fn.substring(0, fn.indexOf('.map26')))
          }
        }
      }
    }
  }
}

def copySourceName = project.findProperty('copySource') ?: 'ratplayer'
def copyDestName = project.findProperty('copyDest') ?: 'ratplayer2'
def compareTeamA = project.findProperty('compareA') ?: 'ratplayer'
def compareTeamB = project.findProperty('compareB') ?: 'ratplayer2'
def compareMaps = project.findProperty('compareMaps') ?: compareMapPool.join(',')

task copyPlayerSnapshot(type: Exec) {
  description 'Copies a player package; used by copyPlayer.'
  commandLine 'bash', "${projectDir}/scripts/copy-player.sh",
      copySourceName.toString(), copyDestName.toString()
  environment 'SKIP_GRADLE', '1'
}

task copyPlayer {
  description 'Snapshot src/<copySource> to src/<copyDest> (defaults ratplayer -> ratplayer2) and compile.'
  group 'battlecode'
  dependsOn copyPlayerSnapshot, classes
}
classes.mustRunAfter copyPlayerSnapshot
setSnapshotAggression.mustRunAfter copyPlayerSnapshot

task comparePlayers(type: Exec) {
  description 'Play compareA vs compareB on compareMaps, both sides, and print a win tally.'
  group 'battlecode'
  dependsOn classes
  commandLine 'bash', "${projectDir}/scripts/compare-players.sh",
      compareTeamA.toString(), compareTeamB.toString(), compareMaps.toString()
  environment 'SKIP_GRADLE', '1'
  environment 'JAVA_CMD', "${System.getProperty('java.home')}/bin/java"
  doFirst {
    environment 'COMPARE_CP', sourceSets.main.runtimeClasspath.asPath
    environment 'COMPARE_CLASSES', sourceSets.main.java.destinationDirectory.get().asFile.absolutePath
  }
}


//////// Submitting ////////

task zipForSubmit(type: Zip) {
  description 'Produce a zip file for submission.'
  group 'battlecode'

  archiveFileName = 'submission.zip'
  destinationDirectory = project.projectDir
  from sourceSets.main.allSource
}
