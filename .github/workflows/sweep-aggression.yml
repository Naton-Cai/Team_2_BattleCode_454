name: Aggression self-play

on:
  workflow_dispatch:
  push:
    branches:
      - feature/self-play-aggression

permissions:
  contents: read
  actions: write

jobs:
  sweep:
    name: 3-map aggression matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Sweep aggression
        run: ./gradlew sweepAggression --console=plain

      - name: Upload sweep summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aggression-self-play
          if-no-files-found: warn
          path: |
            matches/sweep-*/summary.txt
            matches/sweep-*/sweep.log
