// Spotless 8.10.4 + google-java-format 1.36.1. Java under src/ and test/ only.

spotless {
  // Only check Java files that differ from main.
  // ratchetFrom 'origin/main'
  java {
    target 'src/**/*.java', 'test/**/*.java'
    // Skip matching files.
    // targetExclude 'src/examplefuncsplayer/**/*.java'
    // Allow // spotless:off / on regions in source.
    // toggleOffOn()
    googleJavaFormat('1.36.1').formatJavadoc(false)
    // Allow // google-java-format:off / on regions in source.
    expandWildcardImports()
  }
}
