def lerpCombat = { int defensive, int offensive, float a ->
  return Math.round(defensive + a * (offensive - defensive)) as int
}

def parseConfigAssignments = { File cfg ->
  String body = cfg.getText('UTF-8')
      .replaceAll(/(?s)\/\*.*?\*\//, ' ')
      .replaceAll(/\/\/.*/, ' ')
      .replaceAll(/\s+/, ' ')
  def raw = [:]
  def field = ~/(?s)static(?: final)? (?:int|float|boolean|PathingStrategy|CheeseTargetStrategy|CatResponseStrategy|BabyAction\[\]) (\w+) = ([^;]+);/
  def matcher = field.matcher(body)
  while (matcher.find()) {
    raw[matcher.group(1)] = matcher.group(2).replaceAll(/\s+/, ' ').trim()
  }
  return raw
}

def resolveAssignment = { Map raw, String start ->
  def walk
  walk = { String expr, Set seen ->
    if (expr ==~ /-?\d+/) {
      return expr as int
    }
    if (expr == 'true' || expr == 'false') {
      return expr == 'true'
    }
    if (raw.containsKey(expr) && !seen.contains(expr)) {
      seen.add(expr)
      return walk(raw[expr].toString(), seen)
    }
    return expr
  }
  return walk(start, [] as Set)
}

def effectiveConfigValues = { File cfg, float aggression ->
  def raw = parseConfigAssignments(cfg)
  def resolved = [:]
  raw.each { name, expr ->
    resolved[name] = resolveAssignment(raw, expr)
  }
  if (aggression >= 0f) {
    float a = aggression > 1f ? 1f : aggression
    resolved.BACKSTAB_ROUND = lerpCombat(
        resolved.DEFENSIVE_BACKSTAB_ROUND as int,
        resolved.OFFENSIVE_BACKSTAB_ROUND as int,
        a)
    resolved.BABY_CAT_FLEE_HEALTH = lerpCombat(
        resolved.DEFENSIVE_BABY_CAT_FLEE_HEALTH as int,
        resolved.OFFENSIVE_BABY_CAT_FLEE_HEALTH as int,
        a)
    resolved.KING_CAT_FLEE_HEALTH = lerpCombat(
        resolved.DEFENSIVE_KING_CAT_FLEE_HEALTH as int,
        resolved.OFFENSIVE_KING_CAT_FLEE_HEALTH as int,
        a)
    int defensiveCap = resolved.DEFENSIVE_MAX_BABY_RATS as int
    if (a >= 1f) {
      resolved.MAX_BABY_RATS = Integer.MAX_VALUE - (Integer.MAX_VALUE % 4)
    } else {
      int cap = Math.round(defensiveCap + defensiveCap * a)
      resolved.MAX_BABY_RATS = Math.round(cap / 4f) * 4
    }
    resolved.BABY_HUNT_IN_BACKSTAB = a >= 0.5f
  }
  return resolved
}

def readAggressionLiteral = { File aggressionFile ->
  def m = (aggressionFile.getText('UTF-8') =~ /static final float AGGRESSION = ([^;]+);/)
  if (!m.find()) {
    return null
  }
  return Float.parseFloat(m.group(1).replaceAll(/[fF]$/, ''))
}

def effectiveConfigPrinted = [false]
def logEffectiveConfig = { float aggression, File cfg ->
  if (effectiveConfigPrinted[0]) {
    return
  }
  effectiveConfigPrinted[0] = true
  def values = effectiveConfigValues(cfg, aggression)
  logger.quiet("ratplayer2 effective Config (aggression=${aggression}):")
  ['BACKSTAB_ROUND', 'BABY_CAT_FLEE_HEALTH', 'KING_CAT_FLEE_HEALTH', 'MAX_BABY_RATS',
      'BABY_HUNT_IN_BACKSTAB'].each { name ->
    logger.quiet(String.format('  %-32s %s', name, values[name]))
  }
}

def teamConfigFile = { file('src/ratplayer/Config.java') }
def teamAggressionFile = { file("src/${project.property('teamB')}/Aggression.java") }

def resolveMaps = {
  def mapsProperty = project.findProperty('maps')
  if (mapsProperty != null && !mapsProperty.toString().trim().isEmpty()) {
    return mapsProperty.toString().trim()
  }
  def unique = new ArrayList(compareMapPool.unique(false))
  Collections.shuffle(unique)
  int n = Math.min(3, unique.size())
  return unique.subList(0, n).join(',')
}

task setSnapshotAggression {
  description 'If -Paggression is set, writes it into src/<teamB>/Aggression.java. Otherwise leaves that file unchanged.'
  group 'battlecode'
  onlyIf {
    def value = project.findProperty('aggression')
    value != null && !value.toString().trim().isEmpty()
  }
  def destFile = { file("src/${project.property('teamB')}/Aggression.java") }
  doLast {
    File dest = destFile()
    if (!dest.isFile()) {
      throw new GradleException(
          "Missing ${dest}. Run ./gradlew copyPlayer first, then retry with -Paggression.")
    }
    String raw = project.property('aggression').toString().trim()
    if (!(raw ==~ /-?\d+(\.\d+)?[fF]?/)) {
      throw new GradleException("aggression must be a float, got '${raw}'")
    }
    String literal = raw.endsWith('f') || raw.endsWith('F') ? raw : raw + 'f'
    String text = dest.getText('UTF-8')
    String assignment = "static final float AGGRESSION = ${literal};"
    if (!(text =~ /static final float AGGRESSION = [^;]+;/)) {
      throw new GradleException("Could not find AGGRESSION assignment in ${dest}")
    }
    String updated = text.replaceFirst(/static final float AGGRESSION = [^;]+;/, assignment)
    dest.write(updated, 'UTF-8')
    logger.quiet("Set ${dest} AGGRESSION = ${literal}")
    File cfg = teamConfigFile()
    if (cfg.isFile()) {
      logEffectiveConfig(Float.parseFloat(raw.replaceAll(/[fF]$/, '')), cfg)
    }
  }
}
compileJava.mustRunAfter setSnapshotAggression

tasks.named('runJavaLocal').configure {
  dependsOn setSnapshotAggression
  doFirst {
    File aggressionFile = teamAggressionFile()
    File cfg = teamConfigFile()
    if (aggressionFile.isFile() && cfg.isFile()) {
      Float current = readAggressionLiteral(aggressionFile)
      if (current != null) {
        logEffectiveConfig(current, cfg)
      }
    }
    def maps = resolveMaps()
    logger.quiet("Maps: ${maps}")
    jvmArgs '-Dbc.game.maps=' + maps
    def replay = project.findProperty('replay')
    if (replay == null) {
      replay = 'matches/' + matchStamp + '-' + matchGit + '-' +
          truncateString(project.property('teamA') + '-vs-' + project.property('teamB') + '-on-' + maps, 80) +
          '.bc26'
    }
    jvmArgs '-Dbc.server.save-file=' + replay
  }
}

def copySourceName = project.findProperty('copySource') ?: 'ratplayer'
def copyDestName = project.findProperty('copyDest') ?: 'ratplayer2'
def compareTeamA = project.findProperty('compareA') ?: 'ratplayer'
def compareTeamB = project.findProperty('compareB') ?: 'ratplayer2'
def compareMaps = project.findProperty('compareMaps') ?: compareMapPool.join(',')

task copyPlayerSnapshot(type: Exec) {
  description 'Copies a player package; used by copyPlayer.'
  commandLine 'bash', "${projectDir}/scripts/copy-player.sh",
      copySourceName.toString(), copyDestName.toString()
  environment 'SKIP_GRADLE', '1'
}

task copyPlayer {
  description 'Snapshot src/<copySource> to src/<copyDest> (defaults ratplayer -> ratplayer2) and compile.'
  group 'battlecode'
  dependsOn copyPlayerSnapshot, classes
}
classes.mustRunAfter copyPlayerSnapshot
setSnapshotAggression.mustRunAfter copyPlayerSnapshot

task comparePlayers(type: Exec) {
  description 'Play compareA vs compareB on compareMaps, both sides, and print a win tally.'
  group 'battlecode'
  dependsOn classes
  commandLine 'bash', "${projectDir}/scripts/compare-players.sh",
      compareTeamA.toString(), compareTeamB.toString(), compareMaps.toString()
  environment 'SKIP_GRADLE', '1'
  environment 'JAVA_CMD', "${System.getProperty('java.home')}/bin/java"
  doFirst {
    environment 'COMPARE_CP', sourceSets.main.runtimeClasspath.asPath
    environment 'COMPARE_CLASSES', sourceSets.main.java.destinationDirectory.get().asFile.absolutePath
  }
}

def sweepMapsArg = {
  def maps = project.findProperty('compareMaps')
  if (maps == null || maps.toString().trim().isEmpty()) {
    return []
  }
  String trimmed = maps.toString().trim()
  if (trimmed == 'full') {
    return ['--full-pool']
  }
  return [trimmed]
}

task sweepAggression(type: Exec) {
  description 'True self-play AGGRESSION matrix: ratplayer_a* snapshots unique pairs including -1 (live DEFAULT). Default 3 maps; -PcompareMaps=full for the full pool. Does not write Config.'
  group 'battlecode'
  commandLine(['bash', "${projectDir}/scripts/sweep-aggression.sh"] + sweepMapsArg())
  doFirst {
    def aggs = project.findProperty('aggressions')
    if (aggs != null && !aggs.toString().trim().isEmpty()) {
      environment 'AGGRESSIONS', aggs.toString().trim()
    }
  }
}
