def truncateString(String input, int maxLength) {
  if (input.length() > maxLength) {
    return input.substring(0, maxLength)
  }
  return input
}

def matchStamp = new Date().format('yyyyMMdd-HHmmss')
def matchGit = 'nogit'
try {
  def git = ['git', 'rev-parse', '--short', 'HEAD'].execute()
  git.waitFor()
  if (git.exitValue() == 0) {
    matchGit = git.text.trim()
  }
} catch (Exception ignored) {
}

