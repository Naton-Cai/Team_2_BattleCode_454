name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complexity:
    name: Lizard complexity warnings
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install lizard==1.26.1
      - name: Warn on Java functions with CCN > 15
        shell: python
        run: |
          from pathlib import Path
          import lizard

          for path in sorted(Path("src/ratplayer").rglob("*.java")):
              for function in lizard.analyze_file(str(path)).function_list:
                  ccn = function.cyclomatic_complexity
                  if ccn > 15:
                      # Escape GitHub workflow command data and file properties.
                      file = path.as_posix().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      file = file.replace(":", "%3A").replace(",", "%2C")
                      name = function.name.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::warning file={file},line={function.start_line}::{name} has CCN {ccn} (threshold 15)")

  verify:
    name: Build, test, and run
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # google-java-format 1.36.1 via Spotless 8.10.4.
      - name: Check Java format
        run: ./gradlew spotlessCheck --console=plain

      # `build` compiles players and unpacks the client. Tests run in the next step.
      - name: Build
        run: ./gradlew build -x test --console=plain

      # Runs every JUnit class under test/, including ratplayer.
      - name: Test
        run: ./gradlew test --console=plain

      # Headless match: ratplayer (teamA) vs ratplayer_sprint2 (teamB) on maps from gradle.properties.
      - name: Run match
        run: ./gradlew run --console=plain

      # JUnit HTML/XML and the JaCoCo HTML/XML report. Download from the workflow run's Artifacts list on the PR.
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-and-coverage-reports
          if-no-files-found: warn
          path: |
            build/reports/tests/test/
            build/test-results/test/
            build/reports/jacoco/test/
