name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, and run
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # `build` compiles players and unpacks the client. Tests run in the next step.
      - name: Build
        run: ./gradlew build -x test --console=plain

      - name: Test
        run: ./gradlew test --console=plain

      # Headless match using teamA, teamB, and maps from gradle.properties.
      - name: Run match
        run: ./gradlew run --console=plain
